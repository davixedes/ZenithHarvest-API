spring.application.name=zenithharvest-api
server.port=8080

# Banco — injetado via env vars em producao; H2 em teste
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:zenithharvest}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:create-drop}

spring.h2.console.enabled=false
management.endpoints.web.exposure.include=health,info
