server:
  port: 8080

spring:
  application:
    name: gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          # Valida o JWT pela chave pública publicada pelo core (JWKS). Sem segredo compartilhado.
          jwk-set-uri: ${JWK_SET_URI:http://localhost:8081/oauth2/jwks}

# Destinos de roteamento (usados por GatewayRoutesConfig).
zenith:
  gateway:
    core-uri: ${CORE_SVC_URI:http://localhost:8081}
    analise-uri: ${ANALISE_SVC_URI:http://localhost:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info
