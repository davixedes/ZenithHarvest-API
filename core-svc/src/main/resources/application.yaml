server:
  port: 8081

spring:
  application:
    name: core-svc

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/zenith}
    username: ${DB_USERNAME:zenith}
    password: ${DB_PASSWORD:zenith}
    driver-class-name: org.postgresql.Driver

  jpa:
    # Schema é gerido pelo script DDL (db/schema). NUNCA usar update — só validar.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # Tabelas/colunas em PascalCase exigem aspas em TODA query.
        globally_quoted_identifiers: true
        format_sql: true
    show-sql: false

  # Mensageria (publicação de eventos sinistro.aberto). Lazy: só conecta quando usado.
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:zenith}
    password: ${RABBITMQ_PASSWORD:zenith}

# Segurança — JWT assimétrico (RS256). O core assina com chave privada (gerada em memória,
# ver JwtConfig) e publica a pública em /oauth2/jwks. Não há segredo compartilhado.
zenith:
  security:
    jwt:
      expiration-seconds: ${JWT_EXPIRATION_SECONDS:28800}   # 8h
  # Destinos das chamadas Feign síncronas.
  clients:
    analise-uri: ${ANALISE_SVC_URI:http://localhost:8082}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
