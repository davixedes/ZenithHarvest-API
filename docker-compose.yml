# =============================================================================
# Zenith Harvest — stack local completa
# =============================================================================
# Sobe infraestrutura + microsserviços Java do monorepo.
#
#   docker compose up -d
# =============================================================================

services:

  postgres:
    image: postgres:16-alpine
    container_name: zenith-postgres
    environment:
      POSTGRES_DB: zenith
      POSTGRES_USER: zenith
      POSTGRES_PASSWORD: zenith
    ports:
      - "5432:5432"
    volumes:
      - zenith-postgres-data:/var/lib/postgresql/data
      # DDL canônico — roda automaticamente na 1ª inicialização (volume vazio), criando as 39 tabelas.
      - ./db/schema/zenith_harvest_postgres.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      # Seed dos lookups — roda logo após o schema (ordem alfabética dos arquivos).
      - ./db/seed/zenith_harvest_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zenith -d zenith"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    container_name: zenith-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: zenith
      MONGO_INITDB_ROOT_PASSWORD: zenith
      MONGO_INITDB_DATABASE: zenith
    ports:
      - "27017:27017"
    volumes:
      - zenith-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: zenith-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: zenith
      RABBITMQ_DEFAULT_PASS: zenith
    ports:
      - "5672:5672"     # protocolo AMQP
      - "15672:15672"   # painel de administração (http://localhost:15672)
    volumes:
      - zenith-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: zenith-ollama
    ports:
      - "11434:11434"   # API consumida pelo analise-svc (Spring AI)
    volumes:
      - zenith-ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10

  ollama-pull:
    image: ollama/ollama:latest
    container_name: zenith-ollama-pull
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: qwen2:0.5b
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        until ollama list >/dev/null 2>&1; do
          sleep 2
        done
        ollama pull "$${OLLAMA_MODEL}"
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  core-svc:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: core-svc
    container_name: zenith-core-svc
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/zenith
      DB_USERNAME: zenith
      DB_PASSWORD: zenith
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: zenith
      RABBITMQ_PASSWORD: zenith
      ANALISE_SVC_URI: http://analise-svc:8082
      JWT_EXPIRATION_SECONDS: 28800
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  analise-svc:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: analise-svc
    container_name: zenith-analise-svc
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USERNAME: zenith
      POSTGRES_PASSWORD: zenith
      MONGO_HOST: mongo
      MONGO_USERNAME: zenith
      MONGO_PASSWORD: zenith
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: zenith
      RABBITMQ_PASSWORD: zenith
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2:0.5b
      JWK_SET_URI: http://core-svc:8081/oauth2/jwks
      SENTINEL_HUB_ENABLED: ${SENTINEL_HUB_ENABLED:-false}
      SENTINEL_HUB_CLIENT_ID: ${SENTINEL_HUB_CLIENT_ID:-}
      SENTINEL_HUB_CLIENT_SECRET: ${SENTINEL_HUB_CLIENT_SECRET:-}
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
      core-svc:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: gateway
    container_name: zenith-gateway
    environment:
      JWK_SET_URI: http://core-svc:8081/oauth2/jwks
      CORE_SVC_URI: http://core-svc:8081
      ANALISE_SVC_URI: http://analise-svc:8082
    ports:
      - "8080:8080"
    depends_on:
      core-svc:
        condition: service_healthy
      analise-svc:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  zenith-postgres-data:
  zenith-mongo-data:
  zenith-rabbitmq-data:
  zenith-ollama-data:
