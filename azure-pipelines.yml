#  ZenithHarvest API — CI/CD Pipeline (Azure DevOps)
#
#  CI : checkout → JDK 21 → mvn test → mvn package → build & push 3 imagens no ACR
#  CD : deploy dos 5 Container Apps:
#       rabbitmq ┐
#       ollama   ├→ core-svc → analise-svc → gateway  (somente branch main)
#       (paralelos)
#
#  Variaveis SECRETAS (Pipelines > Edit > Variables > marcar "Keep this value secret"):
#    ACR_USERNAME               - usuario admin do ACR (acrzenith)
#    ACR_PASSWORD               - senha do ACR
#    AZURE_CLIENT_ID            - service principal app ID
#    AZURE_CLIENT_SECRET        - service principal secret
#    AZURE_TENANT_ID            - tenant ID
#    AZURE_SUBSCRIPTION_ID      - subscription ID
#    PSQL_SERVER                - FQDN do PostgreSQL (ex: psql-zenith.postgres.database.azure.com)
#    PSQL_ADMIN_PASSWORD        - senha do PostgreSQL
#    RABBITMQ_PASSWORD          - senha do RabbitMQ (usuario fixado em rabbitmqUser abaixo)
#    MONGO_HOST                 - hostname do MongoDB / Cosmos DB (ex: mongo.internal)
#    MONGO_USERNAME             - usuario MongoDB
#    MONGO_PASSWORD             - senha MongoDB
#    (OLLAMA_BASE_URL e derivado automaticamente do Container App — nao precisa setar)
#    SENTINEL_HUB_CLIENT_ID     - (opcional) credencial Sentinel Hub / Copernicus
#    SENTINEL_HUB_CLIENT_SECRET - (opcional) credencial Sentinel Hub / Copernicus

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  acrLoginServer: 'acrzenith.azurecr.io'
  imageTag: '$(Build.BuildId)'
  resourceGroup: 'rg-zenithharvest'
  containerAppsEnv: 'cae-zenithharvest'
  acaRabbitMQ: 'aca-zenith-rabbitmq'
  acaOllama: 'aca-zenith-ollama'
  ollamaModel: 'qwen2:0.5b'
  acaGateway: 'aca-zenith-gateway'
  acaCoreSvc: 'aca-zenith-core-svc'
  acaAnaliseSvc: 'aca-zenith-analise-svc'
  psqlDb: 'db-zenithharvest'
  psqlAdmin: 'zenith_admin'
  rabbitmqUser: 'zenith'

pool:
  vmImage: 'ubuntu-latest'

stages:

# ─── STAGE 1 — CI ─────────────────────────────────────────────────────────────
- stage: CI
  displayName: 'CI — Build, Test & Push'
  jobs:
    - job: BuildTestPush
      displayName: 'Maven build + Docker push (3 imagens)'
      steps:

        - checkout: self
          displayName: 'Checkout'

        - task: JavaToolInstaller@0
          displayName: 'Instalar JDK 21'
          inputs:
            versionSpec: '21'
            jdkArchitectureOption: x64
            jdkSourceOption: PreInstalled

        - task: Cache@2
          displayName: 'Cache dependencias Maven'
          inputs:
            key: 'maven | "$(Agent.OS)" | **/pom.xml'
            restoreKeys: |
              maven | "$(Agent.OS)"
              maven
            path: $(HOME)/.m2/repository

        - task: Maven@4
          displayName: 'mvn test'
          inputs:
            mavenPomFile: 'pom.xml'
            goals: 'test'
            options: '-B'
            publishJUnitResults: true
            testResultsFiles: '**/surefire-reports/TEST-*.xml'
            javaHomeOption: JDKVersion
            jdkVersionOption: '1.21'

        - task: Maven@4
          displayName: 'mvn package'
          inputs:
            mavenPomFile: 'pom.xml'
            goals: 'package'
            options: '-B -DskipTests'
            javaHomeOption: JDKVersion
            jdkVersionOption: '1.21'

        - script: |
            echo "$(ACR_PASSWORD)" | docker login $(acrLoginServer) \
              -u "$(ACR_USERNAME)" --password-stdin
          displayName: 'Login no ACR'
          env:
            ACR_USERNAME: $(ACR_USERNAME)
            ACR_PASSWORD: $(ACR_PASSWORD)

        - script: |
            docker buildx build --platform linux/amd64 \
              --build-arg MODULE=core-svc \
              -t $(acrLoginServer)/zenith-core-svc:$(imageTag) \
              -t $(acrLoginServer)/zenith-core-svc:latest \
              -f Dockerfile --push .
          displayName: 'Build & push — core-svc'

        - script: |
            docker buildx build --platform linux/amd64 \
              --build-arg MODULE=analise-svc \
              -t $(acrLoginServer)/zenith-analise-svc:$(imageTag) \
              -t $(acrLoginServer)/zenith-analise-svc:latest \
              -f Dockerfile --push .
          displayName: 'Build & push — analise-svc'

        - script: |
            docker buildx build --platform linux/amd64 \
              --build-arg MODULE=gateway \
              -t $(acrLoginServer)/zenith-gateway:$(imageTag) \
              -t $(acrLoginServer)/zenith-gateway:latest \
              -f Dockerfile --push .
          displayName: 'Build & push — gateway'

# ─── STAGE 2 — CD ─────────────────────────────────────────────────────────────
- stage: CD
  displayName: 'CD — Deploy Container Apps'
  dependsOn: CI
  condition: |
    and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:

    # ── 0. rabbitmq (infra de mensageria — sobe antes dos servicos) ───────────
    - deployment: DeployRabbitMQ
      displayName: 'Deploy RabbitMQ'
      environment: 'production'
      strategy:
        runOnce:
          deploy:
            steps:

              - script: |
                  curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
                  az extension add --name containerapp --upgrade --only-show-errors
                displayName: 'Instalar Azure CLI + containerapp'

              - script: |
                  az login --service-principal \
                    -u "$(AZURE_CLIENT_ID)" \
                    -p "$(AZURE_CLIENT_SECRET)" \
                    --tenant "$(AZURE_TENANT_ID)"
                  az account set --subscription "$(AZURE_SUBSCRIPTION_ID)"
                displayName: 'Login Azure'

              - script: |
                  if az containerapp show \
                      --name $(acaRabbitMQ) \
                      --resource-group $(resourceGroup) \
                      --only-show-errors &>/dev/null; then
                    echo "Container App ja existe — atualizando imagem..."
                    az containerapp update \
                      --name $(acaRabbitMQ) \
                      --resource-group $(resourceGroup) \
                      --image rabbitmq:3.13-management-alpine
                  else
                    echo "Criando Container App RabbitMQ..."
                    az containerapp create \
                      --name $(acaRabbitMQ) \
                      --resource-group $(resourceGroup) \
                      --environment $(containerAppsEnv) \
                      --image rabbitmq:3.13-management-alpine \
                      --ingress internal \
                      --target-port 5672 \
                      --transport tcp \
                      --min-replicas 1 \
                      --max-replicas 1 \
                      --env-vars \
                        RABBITMQ_DEFAULT_USER=$(rabbitmqUser) \
                        RABBITMQ_DEFAULT_PASS="$(RABBITMQ_PASSWORD)"
                  fi
                displayName: 'Criar ou atualizar Container App — rabbitmq'
                env:
                  RABBITMQ_PASSWORD: $(RABBITMQ_PASSWORD)

              - script: az logout
                displayName: 'Logout Azure'
                condition: always()

    # ── 0b. ollama (paralelo com rabbitmq — LLM local para o analise-svc) ────
    - deployment: DeployOllama
      displayName: 'Deploy Ollama'
      environment: 'production'
      strategy:
        runOnce:
          deploy:
            steps:

              - script: |
                  curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
                  az extension add --name containerapp --upgrade --only-show-errors
                displayName: 'Instalar Azure CLI + containerapp'

              - script: |
                  az login --service-principal \
                    -u "$(AZURE_CLIENT_ID)" \
                    -p "$(AZURE_CLIENT_SECRET)" \
                    --tenant "$(AZURE_TENANT_ID)"
                  az account set --subscription "$(AZURE_SUBSCRIPTION_ID)"
                displayName: 'Login Azure'

              - script: |
                  STARTUP="ollama serve & until ollama list >/dev/null 2>&1; do sleep 2; done; ollama pull $(ollamaModel); wait"

                  if az containerapp show \
                      --name $(acaOllama) \
                      --resource-group $(resourceGroup) \
                      --only-show-errors &>/dev/null; then
                    echo "Container App ja existe — atualizando imagem..."
                    az containerapp update \
                      --name $(acaOllama) \
                      --resource-group $(resourceGroup) \
                      --image ollama/ollama:latest
                  else
                    echo "Criando Container App Ollama..."
                    az containerapp create \
                      --name $(acaOllama) \
                      --resource-group $(resourceGroup) \
                      --environment $(containerAppsEnv) \
                      --image ollama/ollama:latest \
                      --ingress internal \
                      --target-port 11434 \
                      --transport tcp \
                      --min-replicas 1 \
                      --max-replicas 1 \
                      --cpu 2 --memory 4Gi \
                      --command "/bin/sh" \
                      --args "-c" "$STARTUP"
                  fi
                displayName: 'Criar ou atualizar Container App — ollama'

              - script: az logout
                displayName: 'Logout Azure'
                condition: always()

    # ── 1. core-svc (gera o JWK endpoint que os outros dependem) ─────────────
    - deployment: DeployCoreSvc
      displayName: 'Deploy core-svc'
      environment: 'production'
      dependsOn:
        - DeployRabbitMQ
        - DeployOllama
      strategy:
        runOnce:
          deploy:
            steps:

              - script: |
                  curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
                  az extension add --name containerapp --upgrade --only-show-errors
                displayName: 'Instalar Azure CLI + containerapp'

              - script: |
                  az login --service-principal \
                    -u "$(AZURE_CLIENT_ID)" \
                    -p "$(AZURE_CLIENT_SECRET)" \
                    --tenant "$(AZURE_TENANT_ID)"
                  az account set --subscription "$(AZURE_SUBSCRIPTION_ID)"
                displayName: 'Login Azure'

              - script: |
                  az containerapp update \
                    --name $(acaCoreSvc) \
                    --resource-group $(resourceGroup) \
                    --image $(acrLoginServer)/zenith-core-svc:$(imageTag) \
                    --set-env-vars \
                      SPRING_PROFILES_ACTIVE=prod \
                      DB_URL="jdbc:postgresql://$(PSQL_SERVER):5432/$(psqlDb)?sslmode=require" \
                      DB_USERNAME="$(psqlAdmin)" \
                      DB_PASSWORD="$(PSQL_ADMIN_PASSWORD)" \
                      RABBITMQ_HOST="$(acaRabbitMQ)" \
                      RABBITMQ_PORT=5672 \
                      RABBITMQ_USERNAME="$(rabbitmqUser)" \
                      RABBITMQ_PASSWORD="$(RABBITMQ_PASSWORD)" \
                      ANALISE_SVC_URI="http://$(acaAnaliseSvc)" \
                      JWT_EXPIRATION_SECONDS=28800
                displayName: 'Atualizar Container App — core-svc'
                env:
                  PSQL_ADMIN_PASSWORD: $(PSQL_ADMIN_PASSWORD)
                  RABBITMQ_PASSWORD: $(RABBITMQ_PASSWORD)

              - script: az logout
                displayName: 'Logout Azure'
                condition: always()

    # ── 2. analise-svc (depende do core-svc para JWT e do rabbitmq para fila) ─
    - deployment: DeployAnaliseSvc
      displayName: 'Deploy analise-svc'
      environment: 'production'
      dependsOn: DeployCoreSvc
      strategy:
        runOnce:
          deploy:
            steps:

              - script: |
                  curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
                  az extension add --name containerapp --upgrade --only-show-errors
                displayName: 'Instalar Azure CLI + containerapp'

              - script: |
                  az login --service-principal \
                    -u "$(AZURE_CLIENT_ID)" \
                    -p "$(AZURE_CLIENT_SECRET)" \
                    --tenant "$(AZURE_TENANT_ID)"
                  az account set --subscription "$(AZURE_SUBSCRIPTION_ID)"
                displayName: 'Login Azure'

              - script: |
                  az containerapp update \
                    --name $(acaAnaliseSvc) \
                    --resource-group $(resourceGroup) \
                    --image $(acrLoginServer)/zenith-analise-svc:$(imageTag) \
                    --set-env-vars \
                      SPRING_PROFILES_ACTIVE=prod \
                      POSTGRES_HOST="$(PSQL_SERVER)" \
                      POSTGRES_USERNAME="$(psqlAdmin)" \
                      POSTGRES_PASSWORD="$(PSQL_ADMIN_PASSWORD)" \
                      MONGO_HOST="$(MONGO_HOST)" \
                      MONGO_USERNAME="$(MONGO_USERNAME)" \
                      MONGO_PASSWORD="$(MONGO_PASSWORD)" \
                      RABBITMQ_HOST="$(acaRabbitMQ)" \
                      RABBITMQ_USERNAME="$(rabbitmqUser)" \
                      RABBITMQ_PASSWORD="$(RABBITMQ_PASSWORD)" \
                      OLLAMA_BASE_URL="http://$(acaOllama):11434" \
                      OLLAMA_MODEL=$(ollamaModel) \
                      JWK_SET_URI="http://$(acaCoreSvc)/oauth2/jwks" \
                      SENTINEL_HUB_ENABLED="$(SENTINEL_HUB_ENABLED)" \
                      SENTINEL_HUB_CLIENT_ID="$(SENTINEL_HUB_CLIENT_ID)" \
                      SENTINEL_HUB_CLIENT_SECRET="$(SENTINEL_HUB_CLIENT_SECRET)"
                displayName: 'Atualizar Container App — analise-svc'
                env:
                  PSQL_ADMIN_PASSWORD: $(PSQL_ADMIN_PASSWORD)
                  MONGO_PASSWORD: $(MONGO_PASSWORD)
                  RABBITMQ_PASSWORD: $(RABBITMQ_PASSWORD)
                  SENTINEL_HUB_CLIENT_SECRET: $(SENTINEL_HUB_CLIENT_SECRET)

              - script: az logout
                displayName: 'Logout Azure'
                condition: always()

    # ── 3. gateway (ultimo — roteia para os dois servicos anteriores) ──────────
    - deployment: DeployGateway
      displayName: 'Deploy gateway'
      environment: 'production'
      dependsOn: DeployAnaliseSvc
      strategy:
        runOnce:
          deploy:
            steps:

              - script: |
                  curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
                  az extension add --name containerapp --upgrade --only-show-errors
                displayName: 'Instalar Azure CLI + containerapp'

              - script: |
                  az login --service-principal \
                    -u "$(AZURE_CLIENT_ID)" \
                    -p "$(AZURE_CLIENT_SECRET)" \
                    --tenant "$(AZURE_TENANT_ID)"
                  az account set --subscription "$(AZURE_SUBSCRIPTION_ID)"
                displayName: 'Login Azure'

              - script: |
                  az containerapp update \
                    --name $(acaGateway) \
                    --resource-group $(resourceGroup) \
                    --image $(acrLoginServer)/zenith-gateway:$(imageTag) \
                    --set-env-vars \
                      SPRING_PROFILES_ACTIVE=prod \
                      JWK_SET_URI="http://$(acaCoreSvc)/oauth2/jwks" \
                      CORE_SVC_URI="http://$(acaCoreSvc)" \
                      ANALISE_SVC_URI="http://$(acaAnaliseSvc)"
                displayName: 'Atualizar Container App — gateway'

              - script: |
                  FQDN=$(az containerapp show \
                    --name $(acaGateway) \
                    --resource-group $(resourceGroup) \
                    --query properties.configuration.ingress.fqdn -o tsv)
                  echo "Gateway disponivel em: https://$FQDN"
                  echo "Health:                https://$FQDN/actuator/health"
                displayName: 'Mostrar URL publica'

              - script: az logout
                displayName: 'Logout Azure'
                condition: always()
